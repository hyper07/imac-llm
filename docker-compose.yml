services:
  open-webui:
    image: ghcr.io/open-webui/open-webui:main
    container_name: open-webui-vulkan
    restart: always
    ports:
      - "3000:8080"
    extra_hosts:
      # Lets the container reach llama-server running natively on Windows.
      - "host.docker.internal:host-gateway"
    environment:
      # NOTE: these only seed the database on a FIRST run against an empty
      # volume. This volume already existed, so the live values are the ones
      # stored in webui.db (Settings > Admin > Connections), not these.
      OPENAI_API_BASE_URL: "http://host.docker.internal:8080/v1"
      OPENAI_API_KEY: "local-llama"
      ENABLE_OLLAMA_API: "false"
      ANONYMIZED_TELEMETRY: "false"
      DO_NOT_TRACK: "true"
      SCARF_NO_ANALYTICS: "true"
    volumes:
      - open-webui:/app/backend/data

volumes:
  # Reuses the pre-existing volume, so accounts and chat history are kept.
  open-webui:
    external: true
